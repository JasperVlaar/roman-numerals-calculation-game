<svg xmlns="http://www.w3.org/2000/svg" width="54" height="16" viewBox="0 0 54 16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Paard van bovenaf, neus naar rechts. 1 eenheid = 1 wereld-eenheid in de game.
       Het midden van het lijf ligt op y = 8, de schoft (waar het juk ligt) op x = 24,
       de mond op x = 51. Benen, schaduw en teugels tekent quadriga.js. -->
  <defs>
    <linearGradient id="coat" x1="0" y1="3" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4e2c19"/>
      <stop offset=".3" stop-color="#7a4829"/>
      <stop offset=".5" stop-color="#8f5c36"/>
      <stop offset=".7" stop-color="#7a4829"/>
      <stop offset="1" stop-color="#4e2c19"/>
    </linearGradient>
  </defs>
  <!-- staart -->
  <path d="M5.4 7.1 C3.4 6.6 2.2 7.4 .6 6.7 C1.6 7.8 1.4 8.6 .5 9.4 C2.2 9.1 3.4 9.4 5.4 8.9 Z" fill="#1f140e"/>
  <!-- lijf: heupen, taille, schouders, hals, hoofd -->
  <path d="M4.2 8
           C4.2 4.9 6.6 3.3 10 3.3  C13 3.3 14.6 4.1 16.6 4.1
           C19 4.1 21.2 3.1 23.6 3.3  C26 3.5 28.4 4.9 31 5.4
           C33.4 5.8 35.4 5.5 37 5.4
           C37.6 5 38.4 4.8 39 5.3
           C41.2 5.5 43.4 5.6 46 6
           C48.6 6.3 50.6 6.7 51.3 7.4  C51.8 7.8 51.8 8.2 51.3 8.6
           C50.6 9.3 48.6 9.7 46 10
           C43.4 10.4 41.2 10.5 39 10.7
           C38.4 11.2 37.6 11 37 10.6
           C35.4 10.5 33.4 10.2 31 10.6
           C28.4 11.1 26 12.5 23.6 12.7  C21.2 12.9 19 11.9 16.6 11.9
           C14.6 11.9 13 12.7 10 12.7  C6.6 12.7 4.2 11.1 4.2 8 Z" fill="url(#coat)"/>
  <!-- glans op de heupen en rug -->
  <ellipse cx="10.5" cy="8" rx="4.6" ry="2" fill="#a8723f" opacity=".35"/>
  <ellipse cx="20" cy="8" rx="4" ry="1.2" fill="#a8723f" opacity=".25"/>
  <!-- manen langs de halskam -->
  <path d="M23.6 7.4 L26 6.8 L27.8 7.5 L29.8 6.9 L31.6 7.6 L33.6 7 L35.4 7.6 L37.6 7.3 L37.6 8.7 L35.4 8.4 L33.6 9 L31.6 8.4 L29.8 9.1 L27.8 8.5 L26 9.2 L23.6 8.6 Z" fill="#1f140e"/>
  <!-- oren -->
  <path d="M39.2 5.6 L37.2 4.4 L38.2 6.3 Z M39.2 10.4 L37.2 11.6 L38.2 9.7 Z" fill="#3a2214"/>
  <!-- tuig: halsband op de schoft, hoofdstel -->
  <path d="M24.4 3.6 C25.4 6 25.4 10 24.4 12.4" fill="none" stroke="#b8823c" stroke-width="1"/>
  <path d="M48.6 6.5 L48.6 9.5 M41 5.8 L48.6 6.5 M41 10.2 L48.6 9.5" fill="none" stroke="#b8823c" stroke-width=".55"/>
  <!-- neusgaten -->
  <circle cx="50.6" cy="7.3" r=".35" fill="#2a1810"/>
  <circle cx="50.6" cy="8.7" r=".35" fill="#2a1810"/>
  <!-- rode pluim tussen de oren -->
  <ellipse cx="38.4" cy="8" rx="2.4" ry="1.6" fill="#b8352c"/>
  <ellipse cx="38.8" cy="7.8" rx="1.3" ry=".8" fill="#e0604a"/>
</svg>
