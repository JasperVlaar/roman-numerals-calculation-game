<svg xmlns="http://www.w3.org/2000/svg" width="26" height="32" viewBox="0 0 26 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Strijdwagen met menner van bovenaf, voorkant naar rechts. 1 eenheid = 1 wereld-eenheid.
       Het midden ligt op y = 16. De handen van de menner (waar de teugels beginnen) zitten op
       (15.6, 12.8) en (15.6, 19.2); de wielen, de dissel en de teugels tekent quadriga.js. -->
  <!-- as -->
  <rect x="7" y="3" width="2.2" height="26" rx=".6" fill="#3e2818"/>
  <!-- vloer -->
  <path d="M3 6 L13 6 C19 6 22 10.5 22 16 C22 21.5 19 26 13 26 L3 26 Z" fill="#7a5634"/>
  <path d="M3 10 H19.6 M3 14 H21.6 M3 18 H21.6 M3 22 H19.6" stroke="#5e4026" stroke-width=".5"/>
  <!-- borstwering: brons met purper -->
  <path d="M4 6.6 L13 6.6 C18.6 6.6 21.4 10.8 21.4 16 C21.4 21.2 18.6 25.4 13 25.4 L4 25.4" fill="none" stroke="#d49a48" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M4 6.6 L13 6.6 C18.6 6.6 21.4 10.8 21.4 16 C21.4 21.2 18.6 25.4 13 25.4 L4 25.4" fill="none" stroke="#74305a" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="21.4" cy="16" r="1.7" fill="#d49a48"/>
  <circle cx="21.4" cy="16" r=".7" fill="#8a5a22"/>
  <!-- menner: armen naar voren -->
  <path d="M11.6 11.6 L15.6 12.8" stroke="#e3b78c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M11.6 20.4 L15.6 19.2" stroke="#e3b78c" stroke-width="1.7" stroke-linecap="round"/>
  <!-- schouders in purperen tuniek met leren riemen -->
  <ellipse cx="10.6" cy="16" rx="3.3" ry="5.4" fill="#8e3d6e"/>
  <path d="M8.6 12.2 L12.6 19.8 M8.6 19.8 L12.6 12.2" stroke="#5a3a26" stroke-width=".8"/>
  <!-- leren helm -->
  <circle cx="11" cy="16" r="2.7" fill="#6a4a2c"/>
  <circle cx="11.6" cy="15.4" r="1.1" fill="#8e6a44"/>
</svg>
